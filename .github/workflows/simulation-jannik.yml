name: simulation-jannik

on:
  pull_request:
    paths: ["simulation/jannik/**", ".github/workflows/simulation-jannik.yml"]
  push:
    branches: [main]
    paths: ["simulation/jannik/**", ".github/workflows/simulation-jannik.yml"]

defaults:
  run:
    working-directory: simulation/jannik

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest   # includes the Nano C++ tests (g++ is on the runner)

  nano:
    # The Arduino sketch must build for the Nano and fit its 2 KB RAM; also with a
    # generated calibration.h. Pinned versions, like the MicroPython job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.5.1"  # same as tested locally
      - run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.8
          arduino-cli lib install Servo@1.3.0
      - run: uv sync --locked
      - run: uv run pytest tests/test_nano_core.py -v
      - name: Fail if the size check was skipped
        run: uv run pytest tests/test_nano_core.py -q -k "fits or calibration" -rs | grep -q "3 passed"

  micropython:
    # rpm/core and firmware/ must run on the Pico's interpreter, not only on CPython.
    # Same MicroPython release as the Pico firmware we flash. The RP2040 port uses
    # 32-bit floats, the unix port 64-bit by default, so we build both.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        float: [double, single]
    steps:
      - uses: actions/checkout@v4
      - name: Build the MicroPython unix port (${{ matrix.float }} precision floats)
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get install -y --no-install-recommends libffi-dev pkg-config
          git clone --depth 1 --branch v1.29.0 https://github.com/micropython/micropython.git
          make -C micropython/mpy-cross -j4
          make -C micropython/ports/unix submodules
          if [ "${{ matrix.float }}" = single ]; then
            make -C micropython/ports/unix -j4 BUILD=build-mp \
              CFLAGS_EXTRA="-DMICROPY_FLOAT_IMPL=MICROPY_FLOAT_IMPL_FLOAT"
          else
            make -C micropython/ports/unix -j4 BUILD=build-mp
          fi
          echo "$PWD/micropython/ports/unix/build-mp" >> "$GITHUB_PATH"
      - name: Check the float precision
        run: micropython -c "assert (16777217.0 == 16777216.0) == ('${{ matrix.float }}' == 'single')"
      - run: MICROPYPATH=.:firmware:tests/fake_pico micropython tests/micropython_smoke.py
