# Runs the simulation team's checks on every PR, so results do not depend on one developer's PC.
name: simulation

on:
  pull_request:
    paths: ["simulation/**", ".github/workflows/simulation.yml"]
  push:
    branches: [main]
    paths: ["simulation/**", ".github/workflows/simulation.yml"]

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: simulation/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Fast tests
        run: pytest -m "not slow"
