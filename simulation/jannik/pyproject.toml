[project]
name = "rpm-jannik"
version = "0.1.0"
description = "RPM motion logic, Pico firmware and simulation (Jannik's implementation)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.9",
]

[project.scripts]
rpm-sim = "rpm.sim.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rpm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long simulation runs (acceptance criteria)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
# Code blocks in docs/*.md keep their aligned comments for readability.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]
# rpm/core and firmware/ must run on MicroPython: quoted annotations instead of runtime
# typing, and no zip(strict=...), which MicroPython does not implement.
per-file-ignores = { "rpm/core/*" = ["UP", "B905"], "firmware/*" = ["UP"] }

[tool.mypy]
python_version = "3.11"
files = ["rpm"]
strict_optional = true
warn_unused_ignores = true
