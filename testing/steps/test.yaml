# Test topic: full-system checks on the assembled machine running our firmware.
# Owner: Testing team. Fields: id, title, do, expect (type defaults to manual).
steps:
  - id: SYS-01
    title: Starts without a PC
    do: Power the machine from its supply only, with no USB connection to a PC.
    expect: Machine starts random motion on its own.

  - id: SYS-02
    title: Continuous run, 10 minutes
    do: Let the machine run in random-motion mode for 10 minutes.
    expect: Both axes keep moving, no stalls, no skipped gear teeth, no tangled cables.

  - id: SYS-03
    title: Endurance run, 1 hour
    do: Let the machine run for 1 hour, then check the servos and the Pico.
    expect: No reset or stop during the run, servos are warm at most, not hot to the touch.

  - id: SYS-04
    title: Safe stop on power loss
    do: Cut the power during motion, then restore it.
    expect: Machine stops without parts hitting each other and restarts cleanly.

  - id: SYS-05
    title: Sample stays attached
    do: Mount a dummy sample on the platform and run for 10 minutes.
    expect: Sample does not move or loosen, platform screws stay tight.

  - id: SYS-06
    title: Orientation coverage
    do: Log or simulate a run and evaluate it with the orientation coverage metric.
    expect: Coverage meets the threshold defined in docs/interfaces.md. Skip until the metric exists.

  - id: SYS-07
    title: Noise and vibration
    do: Listen to and watch the machine during a run.
    expect: No grinding or clicking, the machine does not shake on its surface.
